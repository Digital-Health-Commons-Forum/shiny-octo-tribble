services:
    minio:
        image: minio/minio
        container_name: minio
        environment:
            MINIO_ROOT_USER: 9fQuwMfXKMDwh9xd2YN6
            MINIO_ROOT_PASSWORD: SGPKltl5v4FgshdB6zem8EZNyfaw3IgvdH35L5Cm
        command: server /data --console-address ":9001"
        volumes:
            - minio-data:/data

    mojo:
        image: mojocore:release
        container_name: mojo
        working_dir: /worker
        command: ["perl", "main.pl","daemon"]
        depends_on:
            - minio
        ports:
            - "3000:3000"

    worker_minio:
        image: mojocore:worker-minio-dev
        container_name: worker_minio
        environment:
            MINIO_ROOT_USER: 9fQuwMfXKMDwh9xd2YN6
            MINIO_ROOT_PASSWORD: SGPKltl5v4FgshdB6zem8EZNyfaw3IgvdH35L5Cm
            MINIO_ACCESS_KEY: test1
            MINIO_SECRET_KEY: test2test2
            MINIO_URI: http://minio:9000
            MOJO_API_UI: http://mojo:3000
        volumes:
            - ./components/worker-minio:/worker
        working_dir: /worker
        command: ["/run.sh"]
        depends_on:
            - mojo
            - minio

volumes:
    minio-data: